# Sync with .github/scripts/sync-labels.sh before publishing forms; GitHub skips missing labels.

- name: "type:feat"
  color: "8957E5"
  description: "New feature or capability"
- name: "type:fix"
  color: "D73A49"
  description: "Bug fix"
- name: "type:docs"
  color: "0969DA"
  description: "Documentation only"
- name: "type:chore"
  color: "6E7781"
  description: "Tooling, infra, deps, maintenance"
- name: "type:investigation"
  color: "0E8A16"
  description: "Find out how something behaves. Impact is unknown until done, so no severity applies"

- name: "severity:high"
  color: "B60205"
  description: "Blocks core functionality, or loses/corrupts data. No workaround"
- name: "severity:medium"
  color: "FBCA04"
  description: "Affects some users but core functions still work, or a workaround exists"
- name: "severity:low"
  color: "FEF2C0"
  description: "Few users or cosmetic. Default; if impact is still unknown use type:investigation instead"

# Keep the Area dropdown in each issue form in step with this set.
- name: "area:pulls"
  color: "1F883D"
  description: "Pull-request domain MCP tools"
- name: "area:issues"
  color: "1F883D"
  description: "Issue domain MCP tools"
- name: "area:repos"
  color: "0E8A16"
  description: "Repository admin MCP tools (create / fork / delete)"
- name: "area:actions"
  color: "1F883D"
  description: "GitHub Actions MCP tools"
- name: "area:security"
  color: "D73A4A"
  description: "Security scanning MCP tools (secret / code scanning / Dependabot)"
- name: "area:notifications"
  color: "1F883D"
  description: "Notification MCP tools"
- name: "area:releases"
  color: "1F883D"
  description: "Release and tag MCP tools"
- name: "area:build"
  color: "1F883D"
  description: "Build, compile, lint/format config, and dependencies"
- name: "area:ci"
  color: "1F883D"
  description: "CI pipelines and git hooks"
- name: "area:test"
  color: "1F883D"
  description: "Test suites and coverage config, at any level"
- name: "area:infra"
  color: "1F883D"
  description: "Deployment target and runtime environment config"
